name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GNOME test dependencies
        run: |
          # Regional EC2 mirrors occasionally stall on large GNOME dependencies.
          sudo sed -i -E 's|http://[^ /]*ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-ecal-2.0 gir1.2-edataserver-1.2 gir1.2-goa-1.0 \
            libglib2.0-bin gnome-shell gnome-calendar gnome-control-center \
            evolution-data-server gnome-online-accounts gnome-session-canberra sound-theme-freedesktop libcanberra-pulse dbus-daemon libgl1-mesa-dri
      - name: Compile settings and validate scripts
        run: |
          glib-compile-schemas --strict schemas
          node --check extension.js
          node --check prefs.js
          for script in install.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - name: Unit tests and release-installer tests
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Calendar RSVP integration
        run: ./tests/run-eds-integration.sh
      - name: GTK, bridge, and restart integration
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GSK_RENDERER: cairo
        run: ./tests/run-companion-integration.sh
